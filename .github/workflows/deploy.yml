name: Validate and deploy Character Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Build for the repository Pages path
        run: npm run build -- --base=/chance-studio/
      - name: Install browser for functional tests
        run: npx playwright install --with-deps chromium
      - name: Test the production site on desktop and mobile
        run: npm run test:e2e
      - name: Keep browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check or initialize Pages
        uses: actions/github-script@v7
        env:
          HAS_SETUP_TOKEN: ${{ secrets.PAGES_SETUP_TOKEN != '' }}
        with:
          github-token: ${{ secrets.PAGES_SETUP_TOKEN || github.token }}
          script: |
            const repo = context.repo;
            const settings = `https://github.com/${repo.owner}/${repo.repo}/settings/pages`;
            let site;
            try {
              site = (await github.rest.repos.getPages(repo)).data;
            } catch (error) {
              if (error.status === 404 && process.env.HAS_SETUP_TOKEN === 'true') {
                try {
                  site = (await github.rest.repos.createPagesSite({...repo, build_type: 'workflow'})).data;
                } catch (createError) {
                  core.setFailed(`Cannot enable GitHub Pages: ${createError.message}. GitHub Free requires a public repository. Check ${settings}.`);
                  return;
                }
              } else {
                core.setFailed(`Cannot read GitHub Pages configuration (HTTP ${error.status}). Enable Pages with source "GitHub Actions" at ${settings}, then rerun this workflow. The built-in GITHUB_TOKEN cannot enable Pages for the first time. Alternatively, configure the optional PAGES_SETUP_TOKEN repository secret documented in README.md. GitHub Free requires a public repository.`);
                return;
              }
            }
            if (site.build_type !== 'workflow') {
              try {
                await github.rest.repos.updateInformationAboutPagesSite({...repo, build_type: 'workflow'});
              } catch (error) {
                core.setFailed(`Pages must use GitHub Actions as its build source. Set it at ${settings}. GitHub returned: ${error.message}`);
              }
            }
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
